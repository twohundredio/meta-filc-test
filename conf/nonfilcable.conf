# Recipes that must NOT be built with fil-c, even when TOOLCHAIN = "fil-c".
# fil-c is a userspace compiler (musl pizfix); the kernel and boot loaders
# need a regular gcc cross toolchain. Everything else (userspace) builds
# with fil-c.
TOOLCHAIN:pn-linux-yocto = "gcc"
TOOLCHAIN:pn-linux-yocto-rt = "gcc"
TOOLCHAIN:pn-u-boot = "gcc"

# other boot loaders / firmware (if a machine or image pulls them in)
TOOLCHAIN:pn-grub = "gcc"
TOOLCHAIN:pn-grub-efi = "gcc"
TOOLCHAIN:pn-syslinux = "gcc"
TOOLCHAIN:pn-kernel-selftest = "gcc"
TOOLCHAIN:pn-perf = "gcc"

# pseudo uses __builtin_apply, which clang-based compilers reject; without
# this the whole build breaks (target pseudo; pseudo-native is unaffected
# since native recipes use the gcc native toolchain)
TOOLCHAIN:pn-pseudo = "gcc"

# All other userspace recipes build with fil-c. The former fallbacks
# (expect, iptables, json-c, libcap, libcap-ng, libgpg-error, libmnl,
# libseccomp, libtasn1, libunistring, libtool-cross, gmp, libffi, perl,
# sed, diffutils) are ported in this layer - see the recipes-*/*/files/
# filc-*.patch bbappends (gmp: --disable-assembly + configure cache
# presets; libffi: 3.8.0 with the upstream FFI_FILC port; perl: -D size/
# byteorder presets for perl-cross; version-script libs: -Wc,
# --version-script=; gnulib-test users: tests dropped from SUBDIRS).
